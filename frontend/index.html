<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Security System</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>OTP Security System</h1>

    <!-- Send OTP screen -->
    <div id="sendScreen" class="card">

      <h2>Send OTP</h2>

      <p>Enter your email address to receive an OTP.</p>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
      >

      <button onclick="sendOtp()">
        Send OTP
      </button>

    </div>


    <!-- Verify OTP screen -->
    <div id="verifyScreen" class="card hidden">

      <h2>Verify OTP</h2>

      <p>Enter the OTP sent to your email.</p>

      <input
        type="email"
        id="verifyEmail"
        placeholder="Enter your email"
      >

      <input
        type="text"
        id="otp"
        placeholder="Enter 6-digit OTP"
        maxlength="6"
      >
        
      <p>OTP expires in: <span id="timer">30</span> seconds</p>
      
      <button onclick="verifyOtp()">
        Verify OTP
      </button>

      <button onclick="resendOtp()" class="secondary">
        Resend OTP
      </button>

      <button onclick="goBack()" class="back">
        Back
      </button>

    </div>


    <!-- Messages -->
    <p id="message"></p>

  </div>

  <script src="script.js"></script>

</body>
</html>
